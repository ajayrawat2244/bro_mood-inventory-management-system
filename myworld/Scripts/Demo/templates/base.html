<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}USC{% endblock title %}</title>
    <style>
        /* Your global styles for the base template */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #3498db;
            color: #ffffff;
            padding: 10px;
            text-align: left;
        }
.button-like {
            display: inline-block;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: 2px solid #3498db;
            border-radius: 5px;
            color: #ffffff;
            background-color: #3498db;
            transition: background-color 0.3s, color 0.3s;
        }

        .button-like:hover {
            background-color: #0066cc;
            color: #ffffff;
        }
        h1 {
            margin: 0;
        }

        nav {
            display: flex;
            justify-content: left;
            background-color: #2980b9;
            padding: 10px;

        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 10px;
            margin: 0 20px;
        }

        /* Add any additional styles for your specific elements */
    </style>
</head>
<body>
    <header>
        <h1 class="button-like">{% block header_title %}<a href="">USC  </a>{% endblock header_title %}</h1>
    </header>

    <nav>
        <a href="">Home</a>
        <a href="sale">Sale and offers</a>
        <a href="sections">Sections</a>
        <a href="#">Contact</a>
    </nav>

    {% block content %}{% endblock content %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Article</title>
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
</head>
<body>
<div class="wrapper">
  {% include 'basic/navbar.html' %}
  {% include 'basic/side_bar.html' %}

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <!-- Page Header -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Add New Article</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="/">Home</a></li>
              <li class="breadcrumb-item active">Add Article</li>
            </ol>
          </div>
        </div>
      </div>
    </section>

    <!-- Manual Form Entry -->
    <form method="POST" action="{% url 'add-article' %}" enctype="multipart/form-data">
      {% csrf_token %}
      <section class="content">
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-6">
              <div class="card card-primary">
                <div class="card-header">
                  <h3 class="card-title">Manual Entry</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label>Product</label>
                    <select name="product" class="form-control" required>
                      {% for option in option2 %}
                      <option value="{{ option.id }}">{{ option }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Selling Price</label>
                    <input type="number" name="selling_price" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label>Customer Price</label>
                    <input type="number" name="customer_price" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label>Color</label>
                    <input type="text" name="color" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label>Size</label>
                    <input type="text" name="size" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" name="quantity" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label>Image</label>
                    <input type="file" name="image" class="form-control">
                  </div>
                </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </div>
            </div>

            <!-- Excel Import Section -->
            <div class="col-md-6">
              <div class="card card-secondary">
                <div class="card-header">
                  <h3 class="card-title">Import Articles (Excel)</h3>
                </div>
                <div class="card-body">
                  <div class="form-group">
                    <label>Upload Excel File</label>
                    <input type="file" name="excel_file" class="form-control">
                  </div>
                </div>
                <div class="card-footer">
                  <button type="submit" name="action" value="import" class="btn btn-secondary">Import</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </form>
  </div>
  {% include 'basic/footer.html' %}
</div>

<script src="{% static 'jquery/jquery.min.js' %}"></script>
<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'dist/js/adminlte.js' %}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    {% load static %}

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdminLTE 3 | Dashboard</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
<!--  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">-->

  <link rel="stylesheet" href="{% static 'fontawesome-free/css/all.min.css' %}">

  <!-- Ionicons -->
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <!-- Tempusdominus Bootstrap 4 -->
<!--  <link rel="stylesheet" href="plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css">-->
  <link rel="stylesheet" href="{% static 'tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css' %}">
  <!-- iCheck -->
<!--  <link rel="stylesheet" href="plugins/icheck-bootstrap/icheck-bootstrap.min.css">-->
  <link rel="stylesheet" href="{% static 'icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- JQVMap -->
<!--  <link rel="stylesheet" href="plugins/jqvmap/jqvmap.min.css">-->
  <link rel="stylesheet" href="{% static 'jqvmap/jqvmap.min.css' %}">
  <!-- Theme style -->
<!--  <link rel="stylesheet" href="dist/css/adminlte.min.css">-->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <!-- overlayScrollbars -->
<!--  <link rel="stylesheet" href="plugins/overlayScrollbars/css/OverlayScrollbars.min.css">-->
  <link rel="stylesheet" href="{% static 'overlayScrollbars/css/OverlayScrollbars.min.css' %}">
  <!-- Daterange picker -->
<!--  <link rel="stylesheet" href="plugins/daterangepicker/daterangepicker.css">-->
  <link rel="stylesheet" href="{% static 'daterangepicker/daterangepicker.css' %}">
  <!-- summernote -->
<!--  <link rel="stylesheet" href="plugins/summernote/summernote-bs4.min.css">-->
  <link rel="stylesheet" href="{% static 'summernote/summernote-bs4.min.css' %}">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Preloader -->
  <div class="preloader flex-column justify-content-center align-items-center">
    <img class="animation__shake" src="{% static 'dist/img/AdminLTELogo.png' %}" alt="AdminLTELogo" height="60" width="60">
  </div>


  {% include 'basic/navbar.html' %}


  {% include 'basic/side_bar.html' %}

  <!-- Content Wrapper. Contains page content -->

 <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Add Product Variant</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="/">Home</a></li>
              <li class="breadcrumb-item active">Add</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
   <form method="POST" action="{% url 'add-productVariant' %}" enctype="multipart/form-data">
     {% csrf_token %}
     <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Product Variant</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->


                <div class="card-body">
                  <div class="form-group">
                    <label for="dropdown">Product</label>
                    <select name="product" class="form-control" id="dropdown1" placeholder="select product" required>
                      {% for option in option2 %}
                      <option value="{{ option.id }}">{{ option }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputEmail5">name</label>
                    <input type="text" name="name" class="form-control" id="exampleInputEmail5" placeholder="name" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputEmail6">Supplier Price</label>
                    <input type="number" name="supplier_price" class="form-control" id="exampleInputEmail6" placeholder="Supplier Price" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputEmail7">Selling Price</label>
                    <input type="number" name="selling_price" class="form-control" id="exampleInputEmail7" placeholder="Selling Price" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputEmail17">Customer Price</label>
                    <input type="number" name="customer_price" class="form-control" id="exampleInputEmail17" placeholder="Customer Price" required>
                  </div>
                  <div class="form-group">
                    <label for="dropdown">Supplier </label>
                    <select name="supplier" class="form-control" id="dropdown" placeholder="Choose Supplier" required>
                      {% for option in supplier_lst %}
                      <option value="{{ option.id }}">{{ option }}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>
            </div>
          </div>

          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Product Variant</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->


                <div class="card-body">
                  <div class="form-group">
                    <label for="exampleInputEmail8">Colors</label>
                    <input type="text" name="color" class="form-control" id="exampleInputEmail8" placeholder="colors(e.g.- Blue, Black, White)" required>

                  </div>
                  <div class="form-group">
                    <label for="exampleInputEmail2">Size</label>
                    <input type="text" name="size_variant" class="form-control" id="exampleInputEmail2" placeholder="Enter sizes(e.g.-5,6,7)" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputEmail9">weight</label>
                    <input type="number" name="weight" class="form-control" id="exampleInputEmail9" placeholder="Enter weight" required>
                  </div>
                  <div class="form-group">
                   <label for="exampleInputEmail">Choose Image</label>
                  <input type="file" name="image" class="form-control" id="exampleInputEmail" required>
                </div>
                </div>
               <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>
          </div>
        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>

   </form>
    <!-- /.content -->
  </div>

  {% include 'basic/footer.html' %}

  <!-- Control Sidebar -->
  <aside class="control-sidebar control-sidebar-dark">
    <!-- Control sidebar content goes here -->
  </aside>
  <!-- /.control-sidebar -->
</div>
<!-- ./wrapper -->

<!-- jQuery -->
<script src= "{% static 'jquery/jquery.min.js' %}"></script>
<!-- jQuery UI 1.11.4 -->
<script src="{% static 'jquery-ui/jquery-ui.min.js' %}"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
  $.widget.bridge('uibutton', $.ui.button)
</script>
<!-- Bootstrap 4 -->
<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- ChartJS -->
<script src="{% static 'chart.js/Chart.min.js' %}"></script>
<!-- Sparkline -->
<script src="{% static 'sparklines/sparkline.js' %}"></script>
<!-- JQVMap -->
<!--<script src="plugins/jqvmap/jquery.vmap.min.js"></script>-->
<script src="{% static 'jqvmap/jquery.vmap.min.js' %}"></script>
<!--<script src="plugins/jqvmap/maps/jquery.vmap.usa.js"></script>-->
<script src="{% static 'jqvmap/maps/jquery.vmap.usa.js' %}"></script>
<!-- jQuery Knob Chart -->
<script src="{% static 'jquery-knob/jquery.knob.min.js' %}"></script>
<!-- daterangepicker -->
<script src="{% static 'moment/moment.min.js' %}"></script>
<script src="{% static 'daterangepicker/daterangepicker.js' %}"></script>
<!-- Tempusdominus Bootstrap 4 -->
<script src="{% static 'tempusdominus-bootstrap-4/js/tempusdominus-bootstrap-4.min.js' %}"></script>
<!-- Summernote -->
<script src="{% static 'summernote/summernote-bs4.min.js' %}"></script>
<!-- overlayScrollbars -->
<script src="{% static 'overlayScrollbars/js/jquery.overlayScrollbars.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'dist/js/adminlte.js' %}" ></script>
<!-- AdminLTE for demo purposes -->
<script src="{% static 'dist/js/demo.js' %}" ></script>
<!-- AdminLTE dashboard demo (This is only for demo purposes) -->
<script src= "{% static 'dist/js/pages/dashboard.js' %}"></script>
</body>
</html>

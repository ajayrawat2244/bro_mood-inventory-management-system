<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdminLTE 3 | Dashboard</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
<!--  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">-->

  <link rel="stylesheet" href="{% static 'fontawesome-free/css/all.min.css' %}">

  <!-- Ionicons -->
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <!-- Tempusdominus Bootstrap 4 -->
<!--  <link rel="stylesheet" href="plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css">-->
  <link rel="stylesheet" href="{% static 'tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css' %}">
  <!-- iCheck -->
<!--  <link rel="stylesheet" href="plugins/icheck-bootstrap/icheck-bootstrap.min.css">-->
  <link rel="stylesheet" href="{% static 'icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- JQVMap -->
<!--  <link rel="stylesheet" href="plugins/jqvmap/jqvmap.min.css">-->
  <link rel="stylesheet" href="{% static 'jqvmap/jqvmap.min.css' %}">
  <!-- Theme style -->
<!--  <link rel="stylesheet" href="dist/css/adminlte.min.css">-->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <!-- overlayScrollbars -->
<!--  <link rel="stylesheet" href="plugins/overlayScrollbars/css/OverlayScrollbars.min.css">-->
  <link rel="stylesheet" href="{% static 'overlayScrollbars/css/OverlayScrollbars.min.css' %}">
  <!-- Daterange picker -->
<!--  <link rel="stylesheet" href="plugins/daterangepicker/daterangepicker.css">-->
  <link rel="stylesheet" href="{% static 'daterangepicker/daterangepicker.css' %}">
  <!-- summernote -->
<!--  <link rel="stylesheet" href="plugins/summernote/summernote-bs4.min.css">-->
  <link rel="stylesheet" href="{% static 'summernote/summernote-bs4.min.css' %}">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Preloader -->
  <div class="preloader flex-column justify-content-center align-items-center">
    <img class="animation__shake" src="{% static 'dist/img/AdminLTELogo.png' %}" alt="AdminLTELogo" height="60" width="60">
  </div>


  {% include 'basic/navbar.html' %}


  {% include 'basic/side_bar.html' %}

  <!-- Content Wrapper. Contains page content -->

 <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Add New Warehouse</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item active">General Form</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-12">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Warehouse</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form method="POST" action="{% url 'add-warehouse' %}">
                {% csrf_token %}
                <div class="card-body">
                  <div class="form-group">
                    <label for="exampleInputEmail4">Name</label>
                    <input type="text" name="name" class="form-control" id="exampleInputEmail4" placeholder="Enter name" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword4">State</label>
                    <input type="text" name="state" class="form-control" id="exampleInputPassword4" placeholder="state name " required>
                  </div>

                  <div class="form-group">
                    <label for="exampleInputEmail1">District</label>
                    <input type="text" name="district" class="form-control" id="exampleInputEmail1" placeholder="district" required>
                  </div>
                  <div class="form-group">
                    <label for="exampleInputPassword1">City</label>
                    <input type="text" name="city" class="form-control" id="exampleInputPassword1" placeholder="City" required>
                  </div>
                <div class="form-group">
                  <label for="mobileNumber">PinCode</label>
                  <input type="tel" name="pincode" class="form-control" id="mobileNumber" placeholder="Enter Pincode" required>
                </div>

                  <div class="form-group">
                  <label for="mobileNumber">Contact Information</label>
                  <input type="text" name="contact_information" class="form-control" id="brand" placeholder="Enter Contact Information" required>
                </div>

                </div>

                <!-- /.card-body -->

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>
            <!-- /.card -->

          </div>

        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>

  {% include 'basic/footer.html' %}

  <!-- Control Sidebar -->
  <aside class="control-sidebar control-sidebar-dark">
    <!-- Control sidebar content goes here -->
  </aside>
  <!-- /.control-sidebar -->
</div>
<!-- ./wrapper -->

<!-- jQuery -->
<script src= "{% static 'jquery/jquery.min.js' %}"></script>
<!-- jQuery UI 1.11.4 -->
<script src="{% static 'jquery-ui/jquery-ui.min.js' %}"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
  $.widget.bridge('uibutton', $.ui.button)
</script>
<!-- Bootstrap 4 -->
<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- ChartJS -->
<script src="{% static 'chart.js/Chart.min.js' %}"></script>
<!-- Sparkline -->
<script src="{% static 'sparklines/sparkline.js' %}"></script>
<!-- JQVMap -->
<!--<script src="plugins/jqvmap/jquery.vmap.min.js"></script>-->
<script src="{% static 'jqvmap/jquery.vmap.min.js' %}"></script>
<!--<script src="plugins/jqvmap/maps/jquery.vmap.usa.js"></script>-->
<script src="{% static 'jqvmap/maps/jquery.vmap.usa.js' %}"></script>
<!-- jQuery Knob Chart -->
<script src="{% static 'jquery-knob/jquery.knob.min.js' %}"></script>
<!-- daterangepicker -->
<script src="{% static 'moment/moment.min.js' %}"></script>
<script src="{% static 'daterangepicker/daterangepicker.js' %}"></script>
<!-- Tempusdominus Bootstrap 4 -->
<script src="{% static 'tempusdominus-bootstrap-4/js/tempusdominus-bootstrap-4.min.js' %}"></script>
<!-- Summernote -->
<script src="{% static 'summernote/summernote-bs4.min.js' %}"></script>
<!-- overlayScrollbars -->
<script src="{% static 'overlayScrollbars/js/jquery.overlayScrollbars.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'dist/js/adminlte.js' %}" ></script>
<!-- AdminLTE for demo purposes -->
<script src="{% static 'dist/js/demo.js' %}" ></script>
<!-- AdminLTE dashboard demo (This is only for demo purposes) -->
<script src= "{% static 'dist/js/pages/dashboard.js' %}"></script>
</body>
</html>

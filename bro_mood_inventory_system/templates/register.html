<html lang="en"><head>
    {% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdminLTE 3 | sign up (v2)</title>

 <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
<!--  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">-->

  <link rel="stylesheet" href="{% static 'fontawesome-free/css/all.min.css' %}">

  <!-- Ionicons -->
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <!-- Tempusdominus Bootstrap 4 -->
<!--  <link rel="stylesheet" href="plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css">-->
  <link rel="stylesheet" href="{% static 'tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css' %}">
  <!-- iCheck -->
<!--  <link rel="stylesheet" href="plugins/icheck-bootstrap/icheck-bootstrap.min.css">-->
  <link rel="stylesheet" href="{% static 'icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- JQVMap -->
<!--  <link rel="stylesheet" href="plugins/jqvmap/jqvmap.min.css">-->
  <link rel="stylesheet" href="{% static 'jqvmap/jqvmap.min.css' %}">
  <!-- Theme style -->
<!--  <link rel="stylesheet" href="dist/css/adminlte.min.css">-->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <!-- overlayScrollbars -->
<!--  <link rel="stylesheet" href="plugins/overlayScrollbars/css/OverlayScrollbars.min.css">-->
  <link rel="stylesheet" href="{% static 'overlayScrollbars/css/OverlayScrollbars.min.css' %}">
  <!-- Daterange picker -->
<!--  <link rel="stylesheet" href="plugins/daterangepicker/daterangepicker.css">-->
  <link rel="stylesheet" href="{% static 'daterangepicker/daterangepicker.css' %}">
  <!-- summernote -->
<!--  <link rel="stylesheet" href="plugins/summernote/summernote-bs4.min.css">-->
  <link rel="stylesheet" href="{% static 'summernote/summernote-bs4.min.css' %}">
</head>
<body class="login-page" style="min-height: 466px;">
<div class="login-box">

<div class="card card-outline card-primary">
<div class="card-header text-center">
<a href="#" class="h3"><b>BM</b></a>
</div>
<div class="card-body">
<p class="login-box-msg">Sign up with BM Inventory to start your session</p>
<form method="POST" action="{% url 'register' %}">
<div class="input-group mb-3">
<input type="text" name="username" class="form-control" placeholder="username">
<div class="input-group-append">
<div class="input-group-text">
</div>
</div>
</div><div class="input-group mb-3">
<input type="text" name="first_name" class="form-control" placeholder="first name">
<div class="input-group-append">
<div class="input-group-text">
</div>
</div>
</div>
  <div class="input-group mb-3">
<input type="text" name="last_name" class="form-control" placeholder="last_name">
<div class="input-group-append">
<div class="input-group-text">
</div>
</div>
</div>
  <div class="input-group mb-3">
<input type="email" name="email" class="form-control" placeholder="email">
<div class="input-group-append">
<div class="input-group-text">
<span class="fas fa-envelope"></span>
</div>
</div>
</div>
<div class="input-group mb-3">
<input type="password" name="password" class="form-control" placeholder="Password">
<div class="input-group-append">
<div class="input-group-text">
<span class="fas fa-lock"></span>
</div>
</div>
</div>
<div class="row">
<div class="col-8">
<div class="icheck-primary">
<input type="checkbox" id="remember">
<label for="remember">
Remember Me
</label>
</div>
</div>

<div class="col-4">
<button type="submit" class="btn btn-primary btn-block">Sign Up</button>
</div>

</div>
</form>
<div class="social-auth-links text-center mt-2 mb-3">
<a href="#" class="btn btn-block btn-primary">
<i class="fab fa-facebook mr-2"></i> Sign in using Facebook
</a>
<a href="#" class="btn btn-block btn-danger">
<i class="fab fa-google-plus mr-2"></i> Sign in using Google+
</a>
</div>


<p class="mb-0">
</p>
</div>

</div>

</div>


<script src="../../plugins/jquery/jquery.min.js"></script>

<script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>

<script src="../../dist/js/adminlte.min.js?v=3.2.0"></script>


</body></html>
